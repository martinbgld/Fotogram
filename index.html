<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Fotoalbum mit Miniaturansicht und Großbildanzeige" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" type="image/png" href="/assets/icons/fotogramfavicon.png">
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="stylesheet" href="/styles/overlay.css">
    <link rel="stylesheet" href="/styles/styles.css">

    <script src="/thumbnails.js" defer></script>
    <script src="/overlay.js" defer></script>
</head>

<body onload="init()">
    <header class="header">
        <div class="header-content">
            <img src="/assets/icons/fotogramLogo.png" alt="Logo_Fotogram">
            <img src="/assets/icons/fotogramText.png" alt="Fotogram">
        </div>
    </header>


    <main class="main-content">
        <section class="main-head">
            <h1>Your personal photo album</h1>
        </section>

        <section id="thumb-slider" class="thumb-slider">

        </section>

        <div id="overlay" class="overlay is-hidden">
            <section  id="overlay-content" class="overlay-content">
                <header class="overlay-header">
                    <h2 id="overlay-image-title" aria-label="Bildname">Bildbezeichnung</h2>

                    <button type="button" class="overlay-btnClose" id="overlay-btnClose"
                        aria-label="Bildansicht schließen">
                        <img src="/assets/icons/closeWhite.png" alt="Icon Close">
                    </button>
                </header>

                <section class="overlay-imagesection">
                    <img id="overlay-image" class="overlay-image">
                </section>

                <footer class="overlay-footer">
                    <nav class="overlay-footnavigation">
                        <button type="button" class="overlay-btnPrev" id="overlay-btnPrev" aria-label="Vorheriges Bild">
                            <img src="/assets/icons/ArrowRightRed.png" alt="Arrow">
                        </button>

                        <p id="overlay-count" class="overlay-count">5/12</p>

                        <button type="button" class="overlay-btnNext" id="overlay-btnNext" aria-label="Nächstes Bild">
                            <img src="/assets/icons/ArrowRightRed.png" alt="Arrow">
                        </button>
                    </nav>
                </footer>
            </section>
        </div>

    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <div class="da-logo">
                    <img src="/assets/icons/DaLogo.png" alt="">
                    <img src="/assets/icons/DaText.png" alt="">
                </div>
                <img src="/assets/icons/DeveloperAkademieGmbH.png" alt="">
            </div>
        </div>

    </footer>
</body>

</html>
